<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>提交成功 · 芙SPA</title>
    <style>
      :root {
        --bg: #fafaf8;
        --text: #2a2620;
        --muted: #8b8278;
        --accent: #c8985e;
        --primary: #2d2823;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 400px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 14px 28px;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        border-radius: 10px;
        font-size: 0.95rem;
      }
      .icon {
        font-size: 48px;
        color: var(--accent);
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>感谢你的参与</h1>
      <p>
        我们已收到你的问卷。主理人礼遇将在审核后，通过你留下的手机号与你联系，实物礼遇将按地址寄送。
      </p>
      <a href="./index.html">返回首页</a>
    </div>
  </body>
</html>
